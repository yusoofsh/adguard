name: Build AdGuard Home image

on:
  push:
    branches: [main]
    paths: [Dockerfile, verify-build.sh, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adguard-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate immutable source inputs
        run: sh verify-build.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yusoofsh/adguardhome:security-sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=adguard
          cache-to: type=gha,mode=max,scope=adguard
      - name: Verify published runtime version and entrypoint
        env:
          IMAGE: ghcr.io/yusoofsh/adguardhome@${{ steps.image.outputs.digest }}
        run: |
          set -eu
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --version | grep -F 'v0.108.0-b.90'
          docker run --rm --entrypoint sh "$IMAGE" -c 'getcap /opt/adguardhome/AdGuardHome' | grep -F cap_net_bind_service
          docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}' | grep -F /opt/adguardhome/AdGuardHome
          printf 'Verified candidate: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
