name: Build and publish verified image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/adguardhome
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build candidate once
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: candidate:test
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify candidate without production credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /opt/adguardhome/AdGuardHome candidate:test --version
          docker run --rm --network none --entrypoint sh candidate:test -ec 'test -s /opt/adguardhome/build/static/index.html'
          test "$(docker image inspect candidate:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${{ github.sha }}"
          test -n "$(docker image inspect candidate:test --format '{{index .Config.Labels "io.yusoofsh.upstream.revision"}}')"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested current-main image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          docker tag candidate:test "$IMAGE:sha-$SOURCE_SHA"
          docker push "$IMAGE:sha-$SOURCE_SHA"
          docker tag candidate:test "$IMAGE:latest"
          docker push "$IMAGE:latest"
