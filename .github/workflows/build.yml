name: Publish image

on:
  push:
    branches: [main]
    paths: [.github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.1.0
      - uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish upstream image
        env:
          SOURCE_IMAGE: adguard/adguardhome:edge
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/adguardhome:latest
        run: docker buildx imagetools create --tag "$TARGET_IMAGE" "$SOURCE_IMAGE"
