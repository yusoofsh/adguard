name: Tag released image

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/adguardhome

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-ys\.[0-9]+$ ]] || { echo "Tag must look like v2026.11.09-ys.1"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tagged commit is not on main"; exit 1; }
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point the version tag at the tested image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          digest_of() { docker buildx imagetools inspect "$1" 2>/dev/null | awk '/^Digest:/ { print $2; exit }'; }
          source_digest="$(digest_of "$IMAGE:sha-$GITHUB_SHA")"
          [ -n "$source_digest" ] || { echo "No tested image exists for $GITHUB_SHA yet. Wait for the publish run on main, then re-run this job."; exit 1; }
          existing="$(digest_of "$IMAGE:$version")"
          if [ -n "$existing" ] && [ "$existing" != "$source_digest" ]; then
            echo "$version already points at a different image"
            exit 1
          fi
          if [ -z "$existing" ]; then
            docker buildx imagetools create --tag "$IMAGE:$version" "$IMAGE@$source_digest"
          fi
          test "$(digest_of "$IMAGE:$version")" = "$source_digest"
          echo "$IMAGE:$version -> $source_digest"
